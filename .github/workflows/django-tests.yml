name: ci # name of workflow

on:
    # triggers the job on master push
    push:
        branches:
            - master
        tags:
            - "v*"  # triggers on version tags

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            # Set up PostgreSQL service for testing
            postgres:
                image: postgres:14
                env:
                    # in .env set postgres_host=localhost to avoid errors
                    POSTGRES_DB: test_db
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                ports:
                    - 5432:5432

            # Set up Redis service for Celery
            # in .env use this as REDIS_URL=redis://redis:6379
            redis:
                image: redis:6
                ports:
                    - 6378:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            # Pulls the Django project from the repo
            - name: Check out repository code
              uses: actions/checkout@v3

            # Installs Python 3.12
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: Create log directory
              run: |
                  mkdir -p logs

            - name: Write .env file from secret
              run: |
                  echo "${{ secrets.ENV_FILE_CONTENTS }}" | base64 --decode > .env

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Run migrations
              run: python manage.py migrate --noinput

            - name: Run tests
              run: |
                  python manage.py test --verbosity=2

    determine-version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.extract-version.outputs.version }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Extract version
              id: extract-version
              run: |
                  if [[ ${{ github.ref }} == refs/tags/v* ]]; then
                    # Tag push: v1.2.3 -> 1.2.3
                    VERSION=${GITHUB_REF#refs/tags/v}
                    echo "version=${VERSION}" >> $GITHUB_OUTPUT
                    echo "Using version from tag: ${VERSION}"
                  elif [[ ${{ github.ref }} == refs/heads/master ]]; then
                    # Normal push to master
                    echo "version=latest" >> $GITHUB_OUTPUT
                    echo "Using 'latest' for master branch"
                  else
                    echo "version=latest" >> $GITHUB_OUTPUT
                  fi

    docker: # job_id
        # The type of runner that the job will run on
        runs-on: ubuntu-latest
        needs: [test, determine-version]
        if: needs.determine-version.outputs.version != 'latest'
        steps:
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: praise002/devsearch:${{ needs.determine-version.outputs.version }}
